name: easygit
description: A cross-platform Git GUI inspired by the Git integration of JetBrains IDEs.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  file_picker: ^11.0.3
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
